<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full Court Run</title>
  <meta name="description" content="Full Court Run - a basketball roguelike deckbuilder. Build a team, beat the shot clock, win the tournament.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23FF6B1A' stroke='%230B1426' stroke-width='7'/><path d='M5 50h90M50 5v90M19 17c17 18 17 48 0 66M81 17c-17 18-17 48 0 66' fill='none' stroke='%230B1426' stroke-width='6'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/ui/theme.css">
  <link rel="stylesheet" href="src/ui/game.css">
  <link rel="stylesheet" href="src/ui/cards.css">
  <link rel="stylesheet" href="src/pages.css">
  <link rel="stylesheet" href="src/title.css">
  <link rel="stylesheet" href="src/avatar.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <div id="boot" class="boot">Loading the arena...</div>

    <!-- TITLE / HOW TO PLAY (rendered by JS) -->
    <section id="screen-title" class="screen" hidden></section>
    <section id="screen-howto" class="screen" hidden></section>

    <!-- MAP / REWARD / END (rendered by JS) -->
    <section id="screen-map" class="screen" hidden></section>
    <section id="screen-reward" class="screen" hidden></section>
    <section id="screen-end" class="screen" hidden></section>

    <!-- GAME -->
    <section id="screen-game" class="screen" hidden>
      <header class="topbar">
        <div class="round-label" id="g-round"></div>
        <div class="scorebug" id="g-scorebug"></div>
        <div class="topbar-right" id="g-tools"></div>
      </header>

      <main class="arena">
        <aside class="side left-col">
          <h3 class="side-title">Your lineup</h3>
          <div id="g-lineup" class="lineup"></div>
          <h3 class="side-title">Chemistry</h3>
          <div id="g-chem" class="chem"></div>
          <h3 class="side-title">Opponent</h3>
          <div id="g-opp" class="opp-traits"></div>
        </aside>

        <div class="court-wrap" id="g-court">
          <div class="css-court" id="css-court"></div>
          <canvas id="three-canvas" hidden></canvas>
          <div class="intent" id="g-intent"></div>
          <div class="fx-layer" id="g-fx"></div>
          <div class="caption" id="g-caption"></div>
        </div>

        <aside class="side right-col">
          <div class="shotclock" id="g-clock"></div>
          <div class="bars" id="g-bars"></div>
          <h3 class="side-title">Play-by-play</h3>
          <div class="log" id="g-log"></div>
        </aside>
      </main>

      <footer class="handbar">
        <div class="piles" id="g-piles"></div>
        <div class="hand" id="g-hand"></div>
        <div class="endturn-wrap">
          <div class="endturn-hint" id="g-endhint"></div>
          <button id="btn-endturn" class="btn btn-primary btn-endturn">END TURN<small>Space</small></button>
        </div>
      </footer>
    </section>

    <!-- Shared overlay (results, pickers) -->
    <div id="overlay" class="overlay" hidden></div>
    <div id="notice" class="notice" role="status" hidden></div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
